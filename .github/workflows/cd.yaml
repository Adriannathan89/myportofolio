name: CD

on:
  push:
    branches: 
      - main
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Push to PWS
        run: |
          git remote add pws https://pws.cs.ui.ac.id/adrian.nathanael/portfolio
          git push pws main:master
      