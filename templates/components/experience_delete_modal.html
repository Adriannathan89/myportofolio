<div id="delete-experience-modal"
     class="award-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-experience-modal-title">
    <button type="button"
            class="award-delete-modal__close"
            popovertarget="delete-experience-modal"
            popovertargetaction="hide"
            aria-label="Close delete confirmation">×</button>
    <h2 id="delete-experience-modal-title">Delete Experience?</h2>
    <p>Are you sure you want to delete <strong id="delete-experience-title"></strong>?</p>
    <form id="experience-delete-form" method="post" class="award-delete-form">
        {% csrf_token %}
        <div class="award-delete-modal__actions">
            <button type="button"
                    class="cancel-button"
                    popovertarget="delete-experience-modal"
                    popovertargetaction="hide">Cancel</button>
            <button type="submit" class="delete-confirm-button">Delete</button>
        </div>
    </form>
</div>
